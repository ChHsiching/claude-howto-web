name: Update Visitor Stats

on:
  schedule:
    - cron: '0 2 * * *'   # UTC 02:00 = Asia/Shanghai 10:00
    - cron: '0 14 * * *'  # UTC 14:00 = Asia/Shanghai 22:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: develop

      - name: Fetch visitor stats from Umami
        id: stats
        env:
          UMAMI_API_URL: ${{ secrets.UMAMI_API_URL }}
          UMAMI_USERNAME: ${{ secrets.UMAMI_USERNAME }}
          UMAMI_PASSWORD: ${{ secrets.UMAMI_PASSWORD }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: |
          node -e '
          const fs = require("fs");
          const BASE = process.env.UMAMI_API_URL;
          const WID = process.env.UMAMI_WEBSITE_ID;
          const headers = { "Content-Type": "application/json" };
          const PATH_PREFIX = "/claude-howto-web";

          async function getStats(authHeaders, startAt, endAt, path) {
            let url = BASE + "/api/websites/" + WID
              + "/stats?startAt=" + startAt + "&endAt=" + endAt;
            if (path) url += "&path=" + encodeURIComponent(path);
            const data = await fetch(url, { headers: authHeaders }).then(r => r.json());
            return data.pageviews ?? 0;
          }

          async function run() {
            const auth = await fetch(BASE + "/api/auth/login", {
              method: "POST", headers,
              body: JSON.stringify({
                username: process.env.UMAMI_USERNAME,
                password: process.env.UMAMI_PASSWORD,
              }),
            }).then(r => r.json());

            const authHeaders = { ...headers, Authorization: "Bearer " + auth.token };
            const now = Date.now();
            const todayStart = new Date();
            todayStart.setUTCHours(0, 0, 0, 0);

            const todayMs = todayStart.getTime();

            // Check if all traffic belongs to our project
            const allPaths = await fetch(
              BASE + "/api/websites/" + WID + "/metrics?type=path&startAt=0&endAt=" + now,
              { headers: authHeaders }
            ).then(r => r.json());
            const ourPaths = allPaths.filter(p => p.x.startsWith(PATH_PREFIX));

            let todayViews, totalViews;
            if (ourPaths.length === allPaths.length) {
              // All traffic is ours: use whole-site stats directly
              todayViews = await getStats(authHeaders, todayMs, now);
              totalViews = await getStats(authHeaders, 0, now);
            } else {
              // Mixed traffic: sum pageviews per path (pageviews are additive)
              todayViews = 0;
              totalViews = 0;
              for (const p of ourPaths) {
                todayViews += await getStats(authHeaders, todayMs, now, p.x);
                totalViews += await getStats(authHeaders, 0, now, p.x);
              }
            }

            const updatedAt = new Date().toLocaleString("sv-SE", {
              timeZone: "Asia/Shanghai",
              year: "numeric", month: "2-digit", day: "2-digit",
              hour: "2-digit", minute: "2-digit", second: "2-digit",
            }).replace(" ", "T") + "+08:00";

            fs.writeFileSync("docs/stats.json",
              JSON.stringify({ todayViews, totalViews, updatedAt }, null, 2) + "\n");

            const outFile = process.env.GITHUB_OUTPUT;
            if (outFile) {
              fs.appendFileSync(outFile, "today=" + todayViews + "\n");
              fs.appendFileSync(outFile, "total=" + totalViews + "\n");
            }
            console.log("Today: " + todayViews + ", Total: " + totalViews);
          }
          run().catch(e => { console.error(e); process.exit(1); });
          '

      - name: Create feature branch and commit
        env:
          GIT_AUTHOR_NAME: ChHsiching
          GIT_AUTHOR_EMAIL: hsichingchang@gmail.com
          GIT_COMMITTER_NAME: ChHsiching
          GIT_COMMITTER_EMAIL: hsichingchang@gmail.com
        run: |
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d-%H%M')
          BRANCH="stats/${TIMESTAMP}"
          git checkout -b "$BRANCH"

          git add -f docs/stats.json
          git commit --allow-empty -m "chore: update visitor stats [skip ci]"

          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"

      - name: Merge to develop
        env:
          GIT_AUTHOR_NAME: ChHsiching
          GIT_AUTHOR_EMAIL: hsichingchang@gmail.com
          GIT_COMMITTER_NAME: ChHsiching
          GIT_COMMITTER_EMAIL: hsichingchang@gmail.com
        run: |
          git checkout develop
          git merge --no-ff "$branch" -m "chore: merge visitor stats update into develop [skip ci]"
          git push origin develop

      - name: Merge to main
        env:
          GIT_AUTHOR_NAME: ChHsiching
          GIT_AUTHOR_EMAIL: hsichingchang@gmail.com
          GIT_COMMITTER_NAME: ChHsiching
          GIT_COMMITTER_EMAIL: hsichingchang@gmail.com
        run: |
          git checkout main
          git merge --no-ff develop -m "chore: update visitor stats [skip ci]"
          git push origin main

      - name: Cleanup feature branch
        if: always()
        run: |
          git push origin --delete "$branch" 2>/dev/null || true
